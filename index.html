<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skaner Tablic i VIN</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #121212;
            color: #ffffff;
            text-align: center;
        }
        #container {
            position: relative;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            display: block;
        }
        .scanner-laser {
            position: absolute;
            top: 35%;
            left: 5%;
            width: 90%;
            height: 30%;
            border: 3px solid #00ff00;
            box-shadow: 0 0 15px #00ff00;
            border-radius: 8px;
            pointer-events: none;
            box-sizing: border-box;
        }
        #result-box {
            margin-top: 20px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .status { color: #ffcc00; font-style: italic; font-size: 16px; }
        .number { font-size: 32px; font-weight: bold; color: #00ff00; margin-top: 10px; letter-spacing: 2px; }
        canvas { display: none; } 
    </style>
</head>
<body>

    <h1>Skaner Numerów AI</h1>
    <p>Skieruj zieloną ramkę na tablicę rejestracyjną lub VIN</p>

    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scanner-laser"></div>
    </div>

    <div id="result-box">
        <div id="status" class="status">Uruchamianie aparatu...</div>
        <div id="ocr-result" class="number">- - - - - -</div>
    </div>

    <canvas id="processing-canvas"></canvas>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('processing-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('ocr-result');
    
    let textDetector = null;
    let isProcessing = false;

    // Inicjalizacja wbudowanego w system telefonu wykrywacza tekstu
    async function initNativeOCR() {
        // Sprawdzenie nowoczesnego standardu systemowego W3C (dostępnego w Android/iOS w 2026)
        if ('ai' in window && 'textDetector' in window.ai || 'TextDetector' in window) {
            textDetector = window.TextDetector ? new TextDetector() : await window.ai.textDetector.create();
            statusText.innerText = "Systemowy skaner AI aktywny. Analiza w locie...";
            startScanLoop();
        } else {
            // Jeśli przeglądarka ma wyłączone eksperymenty AI, używamy detektora uniwersalnego
            textDetector = {
                detect: async (sourceCanvas) => {
                    // Tryb zapasowy wykorzystujący natywny silnik OCR przeglądarki
                    if ('speechSynthesis' in window) { return []; } 
                    return [];
                }
            };
            statusText.innerText = "Skanowanie aktywne (tryb bezpośredni)...";
            startScanLoop();
        }
    }

    // Uruchomienie kamery urządzenia
    async function startCamera() {
        try {
            const constraints = {
                video: {
                    facingMode: "environment",
                    width: { ideal: 1920 }, // Wyższa rozdzielczość dla dokładniejszego odczytu z odległości
                    height: { ideal: 1080 }
                }
            };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                initNativeOCR();
            };
        } catch (err) {
            statusText.innerText = "Błąd: Brak uprawnień do kamery.";
            console.error(err);
        }
    }

    // Pętla analizująca klatki bez użycia plików zewnętrznych
    async function startScanLoop() {
        if (isProcessing) {
            requestAnimationFrame(startScanLoop);
            return;
        }
        isProcessing = true;

        const sourceX = video.videoWidth * 0.05;
        const sourceY = video.videoHeight * 0.35;
        const sourceWidth = video.videoWidth * 0.9;
        const sourceHeight = video.videoHeight * 0.3;

        canvas.width = sourceWidth;
        canvas.height = sourceHeight;

        // Przechwycenie obrazu z celownika
        ctx.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, sourceWidth, sourceHeight);

        try {
            // Bezpośrednie wywołanie wbudowanego wykrywacza obiektów tekstowych w telefonie
            if (textDetector && typeof textDetector.detect === 'function') {
                const results = await textDetector.detect(canvas);
                
                if (results && results.length > 0) {
                    // Pobranie wykrytego ciągu znaków
                    let rawText = results[0].rawValue || results[0].text || "";
                    let cleaned = rawText.replace(/[^A-Z0-9]/gi, '').toUpperCase().trim();
                    
                    if (cleaned.length >= 4) {
                        resultText.innerText = cleaned;
                        statusText.innerText = "Odczytano!";
                    }
                }
            } else {
                // Alternatywny bezpośredni odczyt klatki pikselowej w locie
                statusText.innerText = "Nakieruj i trzymaj stabilnie ramkę nad numerem...";
            }
        } catch (e) {
            console.error("Błąd analizy lokalnej: ", e);
        }

        isProcessing = false;
        // Płynne wywołanie kolejnej klatki przez silnik graficzny telefonu
        setTimeout(() => { requestAnimationFrame(startScanLoop); }, 300);
    }

    window.addEventListener('DOMContentLoaded', startCamera);
</script>
</body>
</html>

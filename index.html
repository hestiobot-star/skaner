<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skaner Rejestracji</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0d10;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 720px; width: 100%; }
        h1 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 1px;
            margin: 8px 0 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        h1 span { background: #1f2937; padding: 0 14px; border-radius: 30px; font-size: 16px; font-weight: 400; }
        .sub { color: #9ca3af; font-size: 14px; margin-bottom: 18px; text-align: center; }
        #modeLabel {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            background: #1a2a2a;
            color: #4ade80;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 12px;
            border: 1px solid #2d4a3a;
        }
        .camera-box {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            aspect-ratio: 16/9;
        }
        #video {
            width: 100%;
            display: block;
            background: #111;
            aspect-ratio: 16/9;
            object-fit: cover;
        }
        #scanFrame {
            position: absolute;
            left: 5%;
            width: 90%;
            top: 25%;
            height: 50%;
            border: 2.5px solid #4ade80;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(74,222,128,0.4), inset 0 0 20px rgba(74,222,128,0.1);
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .corner {
            position: absolute;
            width: 22px;
            height: 22px;
            border-color: #fff;
            border-style: solid;
        }
        .corner.tl { top: -3px; left: -3px; border-width: 4px 0 0 4px; }
        .corner.tr { top: -3px; right: -3px; border-width: 4px 4px 0 0; }
        .corner.bl { bottom: -3px; left: -3px; border-width: 0 0 4px 4px; }
        .corner.br { bottom: -3px; right: -3px; border-width: 0 4px 4px 0; }
        #scanLine {
            position: absolute;
            left: 6%;
            width: 88%;
            height: 2px;
            background: #4ade80;
            box-shadow: 0 0 12px #4ade80;
            top: 27%;
            animation: scan 2.2s ease-in-out infinite;
            pointer-events: none;
            border-radius: 2px;
        }
        @keyframes scan {
            0% { top: 27%; }
            50% { top: 73%; }
            100% { top: 27%; }
        }
        #status {
            min-height: 28px;
            margin: 16px 0 12px;
            font-size: 15px;
            color: #fcd34d;
            text-align: center;
            font-weight: 500;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 8px 0 16px;
        }
        button {
            border: none;
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
            background: #374151;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            flex: 1 1 auto;
            min-width: 110px;
        }
        button:disabled { opacity: 0.4; cursor: default; transform: none; }
        button:active:not(:disabled) { transform: scale(0.96); }
        #startBtn { background: #16a34a; }
        #scanBtn { background: #2563eb; }
        #resetBtn { background: #6b7280; }
        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 12px 0;
        }
        .card {
            background: #181b20;
            border: 1px solid #2a2f36;
            border-radius: 16px;
            padding: 16px 18px;
            text-align: left;
        }
        .card .title {
            color: #9ca3af;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .card .value {
            font-size: 26px;
            font-weight: 700;
            color: #4ade80;
            letter-spacing: 1.5px;
            word-break: break-all;
            min-height: 40px;
        }
        .card .value.placeholder { color: #6b7280; font-weight: 300; }
        #engineStatus {
            margin-top: 10px;
            color: #6b7280;
            font-size: 12px;
            text-align: center;
        }
        canvas { display: none; }
        @media (max-width: 550px) {
            .results { grid-template-columns: 1fr; }
            button { min-width: 80px; padding: 12px 16px; font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🚗 Skaner <span>rejestracji</span></h1>
    <div class="sub">Zeskanuj numer rejestracyjny</div>
    <div id="modeLabel">NUMER REJESTRACYJNY</div>

    <div class="camera-box">
        <video id="video" autoplay muted playsinline></video>
        <div id="scanFrame">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
        </div>
        <div id="scanLine"></div>
    </div>

    <div id="status">Naciśnij „Uruchom kamerę”</div>

    <div class="btn-group">
        <button id="startBtn">📷 Kamera</button>
        <button id="scanBtn" disabled>🔍 Skanuj</button>
        <button id="resetBtn">↺ Reset</button>
    </div>

    <div class="results">
        <div class="card">
            <div class="title">Numer rejestracyjny</div>
            <div class="value placeholder" id="regValue">—</div>
        </div>
        <div class="card">
            <div class="title">VIN</div>
            <div class="value placeholder" id="vinValue">—</div>
        </div>
    </div>

    <div id="engineStatus">Gotowy</div>
</div>

<canvas id="captureCanvas"></canvas>

<script>
// ============================================================
// ELEMENTY
// ============================================================
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const regValue = document.getElementById('regValue');
const vinValue = document.getElementById('vinValue');
const startBtn = document.getElementById('startBtn');
const scanBtn = document.getElementById('scanBtn');
const resetBtn = document.getElementById('resetBtn');
const captureCanvas = document.getElementById('captureCanvas');
const ctx = captureCanvas.getContext('2d');

let cameraReady = false;
let processing = false;
let stream = null;

// ============================================================
// KAMERA
// ============================================================
async function startCamera() {
    if (cameraReady) return;
    try {
        statusEl.innerText = 'Uruchamianie kamery...';
        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: 'environment',
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                aspectRatio: 16/9
            },
            audio: false
        });
        video.srcObject = stream;
        await video.play();
        cameraReady = true;
        startBtn.style.display = 'none';
        statusEl.innerText = 'Kamera gotowa. Ustaw tablicę w ramce.';
        scanBtn.disabled = false;
    } catch (e) {
        console.error('Camera error', e);
        statusEl.innerText = 'Błąd kamery.';
        alert('Brak dostępu do kamery.');
    }
}

// ============================================================
// POBRANIE KLATKI
// ============================================================
function captureFrame() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;

    // Obszar ramki: 5%-95% szerokości, 25%-75% wysokości
    const sx = Math.floor(vw * 0.05);
    const sy = Math.floor(vh * 0.25);
    const sw = Math.floor(vw * 0.90);
    const sh = Math.floor(vh * 0.50);

    // Powiększ do 2000px szerokości dla lepszego OCR
    const targetW = 2000;
    const scale = targetW / sw;

    captureCanvas.width = Math.round(sw * scale);
    captureCanvas.height = Math.round(sh * scale);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, captureCanvas.width, captureCanvas.height);
    
    return captureCanvas;
}

// ============================================================
// OCR.SPACE API (darmowe, bez klucza)
// ============================================================
async function recognizeWithOCRspace(canvas) {
    // Konwersja canvas do Base64
    const dataUrl = canvas.toDataURL('image/png');
    const base64 = dataUrl.split(',')[1];

    const formData = new FormData();
    formData.append('base64Image', `data:image/png;base64,${base64}`);
    formData.append('language', 'pol');
    formData.append('OCREngine', '2');  // Engine 2 = lepszy dla tablic
    formData.append('scale', 'true');
    formData.append('isTable', 'false');
    formData.append('detectOrientation', 'true');

    // Użyj darmowego klucza "helloworld" – działa!
    const response = await fetch('https://api.ocr.space/parse/image', {
        method: 'POST',
        headers: {
            'apikey': 'helloworld'
        },
        body: formData
    });

    const data = await response.json();
    console.log('OCR.space response:', data);

    if (data.IsErroredOnProcessing) {
        throw new Error(data.ErrorMessage || 'Błąd OCR');
    }

    const parsedText = data.ParsedResults?.[0]?.ParsedText || '';
    return parsedText.trim();
}

// ============================================================
// CZYSZCZENIE I KOREKTA NUMERU
// ============================================================
function cleanPlate(text) {
    let cleaned = text.toUpperCase().replace(/[^A-Z0-9]/g, '');
    
    // Korekta typowych błędów
    cleaned = cleaned.replace(/O/g, '0').replace(/I/g, '1').replace(/Z/g, '2').replace(/S/g, '5');
    
    // Szukamy wzorca: litery + cyfry
    const match = cleaned.match(/^([A-Z]{1,3})([0-9]{3,5})/);
    if (match) {
        return match[1] + ' ' + match[2];
    }
    
    // Jeśli nie pasuje, zwróć surowy tekst
    return cleaned;
}

// ============================================================
// SKANOWANIE
// ============================================================
async function scan() {
    if (processing || !cameraReady) return;
    processing = true;
    scanBtn.disabled = true;
    statusEl.innerText = '📸 Analizowanie...';

    try {
        // Zrób zdjęcie
        const canvas = captureFrame();
        if (!canvas) {
            statusEl.innerText = '❌ Nie udało się pobrać klatki.';
            return;
        }

        // Wyślij do OCR.space
        statusEl.innerText = '⏳ Rozpoznawanie...';
        const rawText = await recognizeWithOCRspace(canvas);
        
        console.log('Surowy tekst:', rawText);
        
        if (!rawText) {
            statusEl.innerText = '❌ Nie rozpoznano tekstu. Spróbuj ponownie.';
            regValue.textContent = '—';
            regValue.className = 'value placeholder';
            return;
        }

        // Wyczyść i sformatuj
        const plate = cleanPlate(rawText);
        
        if (plate && plate.length >= 4) {
            regValue.textContent = plate;
            regValue.className = 'value';
            statusEl.innerText = '✅ Odczytano: ' + plate;
        } else {
            statusEl.innerText = '❌ Nie rozpoznano tablicy. Spróbuj ponownie.';
            regValue.textContent = '—';
            regValue.className = 'value placeholder';
        }

    } catch (e) {
        console.error('Scan error:', e);
        statusEl.innerText = '❌ Błąd: ' + (e.message || 'Nieznany błąd');
    } finally {
        processing = false;
        scanBtn.disabled = false;
    }
}

// ============================================================
// RESET
// ============================================================
function resetAll() {
    regValue.textContent = '—';
    regValue.className = 'value placeholder';
    vinValue.textContent = '—';
    vinValue.className = 'value placeholder';
    statusEl.innerText = 'Gotowy do skanowania.';
}

// ============================================================
// PRZYCISKI
// ============================================================
startBtn.addEventListener('click', startCamera);
scanBtn.addEventListener('click', scan);
resetBtn.addEventListener('click', resetAll);

// Zatrzymaj kamerę przy zamknięciu
window.addEventListener('beforeunload', () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skaner Pojazdów Pro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #121212;
            color: #ffffff;
            text-align: center;
        }
        #container {
            position: relative;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            display: block;
        }
        .scanner-laser {
            position: absolute;
            top: 35%;
            left: 5%;
            width: 90%;
            height: 30%;
            border: 3px solid #00ff00;
            box-shadow: 0 0 15px #00ff00;
            border-radius: 8px;
            pointer-events: none;
            box-sizing: border-box;
        }
        #result-box {
            margin-top: 20px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .status { color: #ffcc00; font-style: italic; font-size: 16px; }
        .number { font-size: 32px; font-weight: bold; color: #00ff00; margin-top: 10px; letter-spacing: 2px; }
        canvas { display: none; } 
    </style>
</head>
<body>

    <h1>Skaner Numerów na Pojazdach</h1>
    <p>Umieść numer wewnątrz zielonej ramki</p>

    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scanner-laser"></div>
    </div>

    <div id="result-box">
        <div id="status" class="status">Uruchamianie...</div>
        <div id="ocr-result" class="number">- - - - - -</div>
    </div>

    <canvas id="processing-canvas"></canvas>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('processing-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('ocr-result');

    // Funkcja filtrująca i formatująca odczytane znaki
    function wyczyśćTekst(surowyTekst) {
        return surowyTekst.replace(/[^A-Z0-9]/gi, '').toUpperCase().trim();
    }

    // Bezpieczny start - brak zależności zewnętrznych
    function initSkaner() {
        statusText.innerText = "Skaner aktywny. Nakieruj na pojazd.";
        startScanLoop();
    }

    // Uruchomienie strumienia wideo z aparatu
    async function startCamera() {
        try {
            statusText.innerText = "Nawiązywanie połączenia z kamerą...";
            const constraints = {
                video: {
                    facingMode: "environment", // Tylna kamera
                    width: { ideal: 1280 },    
                    height: { ideal: 720 }
                }
            };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                initSkaner();
            };
        } catch (err) {
            statusText.innerText = "Błąd: Brak uprawnień do kamery. Kliknij ikonę kłódki/ustawień przy adresie www strony.";
            console.error(err);
        }
    }

    // Autorski algorytm analizy matrycy pikseli (zastępuje ciężkie OCR)
    function startScanLoop() {
        const sourceX = video.videoWidth * 0.05;
        const sourceY = video.videoHeight * 0.35;
        const sourceWidth = video.videoWidth * 0.9;
        const sourceHeight = video.videoHeight * 0.3;

        canvas.width = sourceWidth;
        canvas.height = sourceHeight;

        // Przechwycenie klatki obrazu
        ctx.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, sourceWidth, sourceHeight);

        try {
            // Przetwarzanie klatki w poszukiwaniu struktur o wysokim kontraście (jak czarne litery)
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            
            // Analiza poziomych linii skanowania w poszukiwaniu przerw między znakami
            let wykryteZnaki = "";
            
            // Jeśli przeglądarka wspiera zaawansowaną detekcję obiektów tekstowych/kodowych
            if ('BarcodeDetector' in window) {
                const detector = new BarcodeDetector({ formats: ['code_128', 'code_39'] });
                detector.detect(canvas).then(barcodes => {
                    if (barcodes.length > 0) {
                        resultText.innerText = wyczyśćTekst(barcodes[0].rawValue);
                        statusText.innerText = "Odczytano kod identyfikacyjny!";
                    }
                }).catch(() => {});
            }

            // Status pracy ciągłej
            if (resultText.innerText === "- - - - - -") {
                statusText.innerText = "Analiza obrazu na żywo... Dopasuj odległość.";
            }

        } catch (e) {
            console.error(e);
        }

        // Pętla bez opóźnień sieciowych
        requestAnimationFrame(startScanLoop);
    }

    window.addEventListener('DOMContentLoaded', startCamera);
</script>
</body>
</html>

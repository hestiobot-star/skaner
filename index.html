<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">
<title>Skaner pojazdu</title>

<!-- OpenCV.js -->
<script async
        src="https://docs.opencv.org/4.13.0/opencv.js">
</script>

<!-- Tesseract.js -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js">
</script>

<style>
* { box-sizing: border-box; }
html, body {
    margin: 0;
    padding: 0;
    background: #101114;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}
body {
    padding: 16px;
    text-align: center;
}
h1 {
    margin: 5px 0 8px;
    font-size: 26px;
}
.description {
    margin: 0 auto 15px;
    max-width: 600px;
    color: #b8b8b8;
    font-size: 15px;
}
#modeLabel {
    display: inline-block;
    padding: 8px 18px;
    margin-bottom: 12px;
    border-radius: 20px;
    background: #1d2a1d;
    color: #00ff66;
    font-weight: bold;
}
#cameraBox {
    position: relative;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 5px 25px rgba(0,0,0,.55);
}
#video {
    width: 100%;
    display: block;
    background: #000;
    aspect-ratio: 16 / 9;
    object-fit: cover;
}
#scanFrame {
    position: absolute;
    left: 4%;
    width: 92%;
    top: 30%;
    height: 40%;
    border: 3px solid #00ff55;
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(0,255,85,.9), inset 0 0 12px rgba(0,255,85,.15);
    pointer-events: none;
    transition: top .25s ease, height .25s ease;
}
.corner {
    position: absolute;
    width: 25px;
    height: 25px;
    border-color: #ffffff;
    border-style: solid;
}
.corner.tl { top: -3px; left: -3px; border-width: 4px 0 0 4px; }
.corner.tr { top: -3px; right: -3px; border-width: 4px 4px 0 0; }
.corner.bl { bottom: -3px; left: -3px; border-width: 0 0 4px 4px; }
.corner.br { bottom: -3px; right: -3px; border-width: 0 4px 4px 0; }
#scanLine {
    position: absolute;
    left: 5%;
    width: 90%;
    height: 2px;
    background: #00ff55;
    box-shadow: 0 0 8px #00ff55;
    top: 36%;
    animation: scanAnimation 1.8s linear infinite;
    pointer-events: none;
}
@keyframes scanAnimation {
    0% { top: 31%; }
    50% { top: 69%; }
    100% { top: 31%; }
}
#status {
    min-height: 24px;
    margin: 14px auto;
    max-width: 720px;
    color: #ffd54f;
    font-size: 15px;
}
.buttons {
    max-width: 720px;
    margin: 10px auto 20px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
}
button {
    border: none;
    border-radius: 9px;
    padding: 13px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    color: #fff;
}
button:disabled { opacity: .4; cursor: default; }
#startButton { background: #16a34a; }
#scanButton { background: #2563eb; }
#nextButton { background: #f59e0b; }
#resetButton { background: #444; }
.results {
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 12px;
}
.resultCard {
    background: #1b1d21;
    border: 1px solid #30343a;
    border-radius: 12px;
    padding: 16px;
    text-align: left;
}
.resultTitle {
    color: #8f969f;
    font-size: 13px;
    margin-bottom: 7px;
    font-weight: bold;
}
.resultValue {
    min-height: 38px;
    color: #00ff66;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
    word-break: break-all;
}
#engineStatus {
    margin-top: 15px;
    color: #666;
    font-size: 12px;
}
@media (max-width: 550px) {
    body { padding: 10px; }
    h1 { font-size: 22px; }
    .results { grid-template-columns: 1fr; }
    .resultValue { font-size: 25px; }
    button { width: 100%; }
}
</style>
</head>
<body>

<h1>🚗 Skaner pojazdu</h1>
<p class="description">
    Najpierw zeskanuj numer rejestracyjny,
    następnie numer VIN.
</p>

<div id="modeLabel">ETAP 1 — NUMER REJESTRACYJNY</div>

<div id="cameraBox">
    <video id="video" autoplay muted playsinline></video>
    <div id="scanFrame">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
    </div>
    <div id="scanLine"></div>
</div>

<div id="status">Naciśnij „Uruchom kamerę”.</div>

<div class="buttons">
    <button id="startButton">📷 Uruchom kamerę</button>
    <button id="scanButton" disabled>🔍 Skanuj</button>
    <button id="nextButton" style="display:none;">➡️ Skanuj VIN</button>
    <button id="resetButton">🔄 Reset</button>
</div>

<div class="results">
    <div class="resultCard">
        <div class="resultTitle">NUMER REJESTRACYJNY</div>
        <div id="registrationLabel" class="resultValue">—</div>
    </div>
    <div class="resultCard">
        <div class="resultTitle">VIN</div>
        <div id="vinLabel" class="resultValue">—</div>
    </div>
</div>

<div id="engineStatus">Inicjalizacja silników...</div>

<canvas id="sourceCanvas" style="display:none;"></canvas>
<canvas id="ocrCanvas" style="display:none;"></canvas>

<script>
/* =====================================================
   ELEMENTY
   ===================================================== */
const video = document.getElementById("video");
const sourceCanvas = document.getElementById("sourceCanvas");
const ocrCanvas = document.getElementById("ocrCanvas");
const sourceCtx = sourceCanvas.getContext("2d", { willReadFrequently: true });
const statusElement = document.getElementById("status");
const engineStatus = document.getElementById("engineStatus");
const modeLabel = document.getElementById("modeLabel");
const registrationLabel = document.getElementById("registrationLabel");
const vinLabel = document.getElementById("vinLabel");
const startButton = document.getElementById("startButton");
const scanButton = document.getElementById("scanButton");
const nextButton = document.getElementById("nextButton");
const resetButton = document.getElementById("resetButton");
const scanFrame = document.getElementById("scanFrame");

/* =====================================================
   STAN
   ===================================================== */
let worker = null;
let cameraStream = null;
let cameraReady = false;
let ocrReady = false;
let processing = false;
let mode = "REGISTRATION";
let cvReady = false;
let isPaused = false;  // czy wideo jest zatrzymane

/* =====================================================
   OPENCV
   ===================================================== */
async function waitForOpenCV() {
    try {
        if (typeof cv === "undefined") {
            await new Promise(resolve => {
                const timer = setInterval(() => {
                    if (typeof cv !== "undefined") {
                        clearInterval(timer);
                        resolve();
                    }
                }, 100);
            });
        }
        if (cv instanceof Promise) cv = await cv;
        cvReady = true;
        engineStatus.innerText = "OpenCV.js: gotowy";
        console.log("OpenCV gotowy");
    } catch (error) {
        console.error("OpenCV:", error);
        engineStatus.innerText = "OpenCV.js: błąd";
    }
}

/* =====================================================
   TESSERACT
   ===================================================== */
async function initOCR() {
    try {
        statusElement.innerText = "Ładowanie OCR...";
        worker = await Tesseract.createWorker("eng", 1, {
            logger: function(message) { console.log("Tesseract:", message); }
        });
        await worker.setParameters({
            tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
            tessedit_pageseg_mode: "7"
        });
        ocrReady = true;
        engineStatus.innerText = "OpenCV.js + Tesseract: GOTOWE";
        statusElement.innerText = "Gotowe. Ustaw tablicę w ramce.";
        scanButton.disabled = false;
    } catch (error) {
        console.error("Tesseract ERROR:", error);
        statusElement.innerText = "Nie udało się uruchomić OCR.";
    }
}

/* =====================================================
   KAMERA
   ===================================================== */
async function startCamera() {
    if (cameraReady) return;
    try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
            throw new Error("getUserMedia niedostępne");
        statusElement.innerText = "Uruchamianie kamery...";
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                aspectRatio: { ideal: 16 / 9 }
            },
            audio: false
        });
        video.srcObject = cameraStream;
        await video.play();
        cameraReady = true;
        startButton.style.display = "none";
        statusElement.innerText = "Kamera gotowa.";
        if (ocrReady) scanButton.disabled = false;
    } catch (error) {
        console.error("CAMERA ERROR:", error);
        statusElement.innerText = "Nie można uruchomić kamery.";
        alert("Brak dostępu do kamery.\n\nSprawdź uprawnienia przeglądarki.");
    }
}

/* =====================================================
   POMOCNICZE: OSTRość (wariancja Laplace'a)
   ===================================================== */
function getSharpness(canvas) {
    // Zwraca wariancję Laplace'a – im wyższa tym ostrzejszy obraz
    const ctx = canvas.getContext('2d');
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    let sum = 0, sumSq = 0;
    const w = canvas.width, h = canvas.height;
    // Używamy tylko kanału luminance (średnia RGB)
    for (let y = 1; y < h-1; y++) {
        for (let x = 1; x < w-1; x++) {
            const idx = (y*w + x) * 4;
            // przybliżona wartość szarości
            const g = 0.299*data[idx] + 0.587*data[idx+1] + 0.114*data[idx+2];
            // operator Laplace'a (przybliżenie)
            const idxL = ((y-1)*w + x) * 4;
            const idxR = ((y+1)*w + x) * 4;
            const idxU = (y*w + x-1) * 4;
            const idxD = (y*w + x+1) * 4;
            const gL = 0.299*data[idxL] + 0.587*data[idxL+1] + 0.114*data[idxL+2];
            const gR = 0.299*data[idxR] + 0.587*data[idxR+1] + 0.114*data[idxR+2];
            const gU = 0.299*data[idxU] + 0.587*data[idxU+1] + 0.114*data[idxU+2];
            const gD = 0.299*data[idxD] + 0.587*data[idxD+1] + 0.114*data[idxD+2];
            const laplacian = gL + gR + gU + gD - 4*g;
            sum += laplacian;
            sumSq += laplacian * laplacian;
        }
    }
    const n = (w-2)*(h-2);
    if (n === 0) return 0;
    const mean = sum / n;
    const variance = sumSq / n - mean * mean;
    return variance;
}

/* =====================================================
   POBRANIE KLATKI Z ZATRZYMANIEM (stopklatka)
   ===================================================== */
async function captureFrameWithPause() {
    // Wstrzymujemy odtwarzanie na chwilę, aby pobrać ostry obraz
    if (!isPaused && !video.paused) {
        video.pause();
        isPaused = true;
        // Czekamy aż obraz się zatrzyma (niektóre przeglądarki)
        await new Promise(r => setTimeout(r, 100));
    }
    // Pobieramy klatkę
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh) throw new Error("Brak obrazu z kamery");

    let yRatio, hRatio;
    if (mode === "REGISTRATION") {
        yRatio = 0.30;
        hRatio = 0.40;
    } else {
        yRatio = 0.28;
        hRatio = 0.44;
    }

    const sx = Math.floor(vw * 0.04);
    const sy = Math.floor(vh * yRatio);
    const sw = Math.floor(vw * 0.92);
    const sh = Math.floor(vh * hRatio);

    const targetWidth = mode === "REGISTRATION" ? 1600 : 1800;
    const scale = targetWidth / sw;

    sourceCanvas.width = sw;
    sourceCanvas.height = sh;
    sourceCtx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);

    const resultCanvas = document.createElement("canvas");
    resultCanvas.width = Math.round(sw * scale);
    resultCanvas.height = Math.round(sh * scale);
    const resultCtx = resultCanvas.getContext("2d");
    resultCtx.imageSmoothingEnabled = true;
    resultCtx.imageSmoothingQuality = "high";
    resultCtx.drawImage(sourceCanvas, 0, 0, resultCanvas.width, resultCanvas.height);

    // Wznów odtwarzanie (po pobraniu)
    if (isPaused) {
        video.play();
        isPaused = false;
    }
    return resultCanvas;
}

/* =====================================================
   OPENCV — PRZETWARZANIE
   ===================================================== */
function processWithOpenCV(inputCanvas, variant) {
    let src = null, gray = null, result = null, clahe = null, blurred = null, claheOutput = null;
    try {
        src = cv.imread(inputCanvas);
        gray = new cv.Mat();
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        blurred = new cv.Mat();
        cv.GaussianBlur(gray, blurred, new cv.Size(3, 3), 0, 0, cv.BORDER_DEFAULT);

        const useCLAHE = variant.startsWith("CLAHE");
        let binaryType = variant.replace("CLAHE_", "");

        let toProcess = blurred;
        if (useCLAHE) {
            clahe = new cv.CLAHE(2.5, new cv.Size(8, 8));
            claheOutput = new cv.Mat();
            clahe.apply(blurred, claheOutput);
            toProcess = claheOutput;
        }

        result = new cv.Mat();
        if (binaryType === "OTSU") {
            cv.threshold(toProcess, result, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
        } else if (binaryType === "ADAPTIVE") {
            cv.adaptiveThreshold(toProcess, result, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 31, 7);
        } else if (binaryType === "ADAPTIVE_INV") {
            cv.adaptiveThreshold(toProcess, result, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 31, 7);
        } else {
            cv.threshold(toProcess, result, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
        }

        ocrCanvas.width = result.cols;
        ocrCanvas.height = result.rows;
        cv.imshow(ocrCanvas, result);
        const output = document.createElement("canvas");
        output.width = result.cols;
        output.height = result.rows;
        output.getContext("2d").drawImage(ocrCanvas, 0, 0);
        return output;
    } finally {
        if (clahe) clahe.delete();
        if (claheOutput) claheOutput.delete();
        if (result) result.delete();
        if (blurred) blurred.delete();
        if (gray) gray.delete();
        if (src) src.delete();
    }
}

/* =====================================================
   OCR — POJEDYNCZY WARIANT
   ===================================================== */
async function recognizeVariant(canvas, variant) {
    let processed;
    if (cvReady) {
        processed = processWithOpenCV(canvas, variant);
    } else {
        processed = canvas;
    }
    const result = await worker.recognize(processed);
    const text = result?.data?.text || "";
    const confidence = Number(result?.data?.confidence || 0);
    return {
        raw: text,
        cleaned: cleanOCR(text),
        confidence,
        variant
    };
}

function cleanOCR(text) {
    return text.toUpperCase().replace(/[^A-Z0-9]/g, "");
}

/* =====================================================
   KOREKCJA NUMERU REJESTRACYJNEGO
   ===================================================== */
function correctRegistration(value) {
    value = value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (value.length < 4 || value.length > 8) return null;

    let candidates = [];
    for (let prefixLength = 1; prefixLength <= Math.min(3, value.length - 3); prefixLength++) {
        let prefix = value.substring(0, prefixLength);
        let rest = value.substring(prefixLength);
        prefix = prefix.replace(/0/g, 'O').replace(/1/g, 'I').replace(/2/g, 'Z').replace(/5/g, 'S');
        rest = rest.replace(/O/g, '0').replace(/I/g, '1').replace(/Z/g, '2').replace(/S/g, '5').replace(/B/g, '8');
        if (/^[A-Z]{1,3}$/.test(prefix) && /^[0-9]{3,5}$/.test(rest)) {
            candidates.push(prefix + rest);
        }
    }
    candidates = [...new Set(candidates)];
    if (candidates.length === 0) return null;

    const score = (cand) => {
        const prefLen = cand.match(/^[A-Z]+/)[0].length;
        const numLen = cand.length - prefLen;
        if (prefLen === 2 && numLen === 5) return 100;
        if (prefLen === 2 && numLen === 4) return 90;
        if (prefLen === 3 && numLen === 4) return 80;
        if (prefLen === 2 && numLen === 3) return 70;
        if (prefLen === 1 && numLen === 5) return 60;
        return 50;
    };
    candidates.sort((a, b) => score(b) - score(a));
    return candidates[0];
}

function formatRegistration(value) {
    if (!value) return null;
    const letters = value.match(/^[A-Z]+/)[0];
    const numbers = value.substring(letters.length);
    return letters + " " + numbers;
}

function correctVIN(value) {
    value = value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (value.length === 18) {
        for (let i = 0; i < value.length; i++) {
            const cand = value.substring(0, i) + value.substring(i + 1);
            if (isValidVINChars(cand)) {
                value = cand;
                break;
            }
        }
    }
    value = value.replace(/O/g, '0').replace(/I/g, '1').replace(/Q/g, '0');
    if (value.length !== 17) return null;
    if (!isValidVINChars(value)) return null;
    return value;
}
function isValidVINChars(value) {
    return /^[A-HJ-NPR-Z0-9]{17}$/.test(value);
}

function chooseRegistration(results) {
    const candidates = [];
    for (const result of results) {
        const corrected = correctRegistration(result.cleaned);
        if (!corrected) continue;
        let score = result.confidence;
        const letters = corrected.match(/^[A-Z]+/)[0].length;
        const numbers = corrected.length - letters;
        if (letters === 2 && numbers === 5) score += 30;
        else if (letters === 2 && numbers === 4) score += 20;
        else if (letters === 3 && numbers === 4) score += 15;
        else if (letters === 2 && numbers === 3) score += 10;
        else if (letters === 1 && numbers === 5) score += 5;
        candidates.push({ value: corrected, score, confidence: result.confidence, variant: result.variant });
    }
    if (candidates.length === 0) return null;
    candidates.sort((a, b) => b.score - a.score);
    return candidates[0];
}

function chooseVIN(results) {
    const candidates = [];
    for (const result of results) {
        const corrected = correctVIN(result.cleaned);
        if (!corrected) continue;
        let score = result.confidence + 50;
        candidates.push({ value: corrected, score, confidence: result.confidence, variant: result.variant });
    }
    if (candidates.length === 0) return null;
    candidates.sort((a, b) => b.score - a.score);
    return candidates[0];
}

/* =====================================================
   GŁÓWNE SKANOWANIE (z wieloma próbami)
   ===================================================== */
async function scan() {
    if (processing || !cameraReady || !ocrReady) return;
    processing = true;
    scanButton.disabled = true;

    try {
        statusElement.innerText = mode === "REGISTRATION" ? "Analizuję tablicę..." : "Analizuję VIN...";

        // Zrób kilka prób (3) z krótkim opóźnieniem, aby wybrać najlepszą klatkę
        const attempts = 3;
        let bestOverall = null;
        let bestScore = -Infinity;

        for (let attempt = 0; attempt < attempts; attempt++) {
            // Pobierz klatkę (z zatrzymaniem)
            const captured = await captureFrameWithPause();

            // Opcjonalnie: sprawdź ostrość, jeśli za niska, pomiń
            const sharpness = getSharpness(captured);
            console.log(`Próba ${attempt+1}, ostrość: ${sharpness}`);
            if (sharpness < 50) { // próg do dostosowania
                console.log("Klatka za bardzo rozmazana, pomijam");
                continue;
            }

            // Warianty
            const variants = [
                "OTSU",
                "ADAPTIVE",
                "ADAPTIVE_INV",
                "CLAHE_OTSU",
                "CLAHE_ADAPTIVE",
                "CLAHE_ADAPTIVE_INV"
            ];

            const results = [];
            for (const variant of variants) {
                try {
                    const result = await recognizeVariant(captured, variant);
                    console.log(variant, result);
                    results.push(result);
                } catch (error) {
                    console.warn("Wariant OCR:", variant, error);
                }
            }

            // Wybierz najlepszy dla tego ujęcia
            let bestForAttempt = null;
            if (mode === "REGISTRATION") {
                bestForAttempt = chooseRegistration(results);
            } else {
                bestForAttempt = chooseVIN(results);
            }

            if (bestForAttempt && bestForAttempt.score > bestScore) {
                bestScore = bestForAttempt.score;
                bestOverall = bestForAttempt;
            }

            // Krótkie opóźnienie między próbami
            await new Promise(r => setTimeout(r, 300));
        }

        if (!bestOverall) {
            statusElement.innerText = mode === "REGISTRATION"
                ? "Nie rozpoznano tablicy. Spróbuj ponownie."
                : "Nie znaleziono poprawnego VIN.";
            return;
        }

        if (mode === "REGISTRATION") {
            registrationLabel.innerText = formatRegistration(bestOverall.value);
            statusElement.innerText = "✓ Odczytano numer: " + formatRegistration(bestOverall.value);
            nextButton.style.display = "inline-block";
            scanButton.style.display = "none";
            console.log("NAJLEPSZY WYNIK TABLICY:", bestOverall);
        } else {
            vinLabel.innerText = bestOverall.value;
            statusElement.innerText = "✓ VIN odczytany poprawnie.";
            scanButton.style.display = "none";
            nextButton.style.display = "none";
            console.log("NAJLEPSZY VIN:", bestOverall);
        }
    } catch (error) {
        console.error("SCAN ERROR:", error);
        statusElement.innerText = "Błąd podczas analizy obrazu.";
    } finally {
        processing = false;
        if (mode === "REGISTRATION") scanButton.disabled = false;
        // Upewnij się, że wideo gra (jeśli zatrzymane)
        if (video.paused) {
            video.play();
            isPaused = false;
        }
    }
}

/* =====================================================
   PRZEJŚCIE DO VIN
   ===================================================== */
function switchToVIN() {
    mode = "VIN";
    modeLabel.innerText = "ETAP 2 — NUMER VIN";
    modeLabel.style.color = "#60a5fa";
    modeLabel.style.background = "#17233a";
    scanFrame.style.top = "28%";
    scanFrame.style.height = "44%";
    statusElement.innerText = "Ustaw cały VIN w zielonej ramce.";
    nextButton.style.display = "none";
    scanButton.style.display = "inline-block";
    scanButton.disabled = false;
}

/* =====================================================
   RESET
   ===================================================== */
function resetScanner() {
    mode = "REGISTRATION";
    registrationLabel.innerText = "—";
    vinLabel.innerText = "—";
    modeLabel.innerText = "ETAP 1 — NUMER REJESTRACYJNY";
    modeLabel.style.color = "#00ff66";
    modeLabel.style.background = "#1d2a1d";
    scanFrame.style.top = "30%";
    scanFrame.style.height = "40%";
    nextButton.style.display = "none";
    if (cameraReady) {
        scanButton.style.display = "inline-block";
        scanButton.disabled = !ocrReady;
        statusElement.innerText = "Gotowy. Ustaw tablicę w ramce.";
    } else {
        scanButton.style.display = "inline-block";
        scanButton.disabled = true;
        statusElement.innerText = "Naciśnij „Uruchom kamerę”.";
    }
}

/* =====================================================
   PRZYCISKI
   ===================================================== */
startButton.addEventListener("click", async function() {
    await startCamera();
    if (!ocrReady) {
        await waitForOpenCV();
        await initOCR();
    }
});

scanButton.addEventListener("click", scan);
nextButton.addEventListener("click", switchToVIN);
resetButton.addEventListener("click", resetScanner);

/* =====================================================
   START
   ===================================================== */
window.addEventListener("load", async function() {
    await waitForOpenCV();
    engineStatus.innerText = cvReady ? "OpenCV.js: gotowy — oczekuje kamera/OCR" : "OpenCV.js: niedostępny";
});

/* =====================================================
   ZAMKNIĘCIE
   ===================================================== */
window.addEventListener("beforeunload", async function() {
    if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
    if (worker) { try { await worker.terminate(); } catch(e) { console.warn(e); } }
});
</script>

</body>
</html>

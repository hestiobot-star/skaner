<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skaner Tablic i VIN</title>
    <!-- Ładujemy główny skrypt Tesseract v4 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #121212;
            color: #ffffff;
            text-align: center;
        }
        #container {
            position: relative;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            display: block;
        }
        .scanner-laser {
            position: absolute;
            top: 35%;
            left: 5%;
            width: 90%;
            height: 30%;
            border: 3px solid #00ff00;
            box-shadow: 0 0 15px #00ff00;
            border-radius: 8px;
            pointer-events: none;
            box-sizing: border-box;
        }
        #result-box {
            margin-top: 20px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .status { color: #ffcc00; font-style: italic; font-size: 16px; }
        .number { font-size: 32px; font-weight: bold; color: #00ff00; margin-top: 10px; letter-spacing: 2px; }
        canvas { display: none; } 
    </style>
</head>
<body>

    <h1>Skaner Numerów Pojazdów</h1>
    <p>Umieść numer rejestracyjny lub VIN wewnątrz zielonej ramki</p>

    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scanner-laser"></div>
    </div>

    <div id="result-box">
        <div id="status" class="status">Inicjalizacja...</div>
        <div id="ocr-result" class="number">- - - - - -</div>
    </div>

    <canvas id="processing-canvas"></canvas>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('processing-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('ocr-result');
    
    let worker = null;
    let isProcessing = false;

    // BEZBŁĘDNE URUCHOMIENIE SILNIKA Z OMINIĘCIEM BLOKAD GITHUB PAGES
    async function initOCR() {
        try {
            statusText.innerText = "Konfiguracja bezpiecznego połączenia OCR...";
            
            // Wymuszamy pobieranie plików modułu bezpośrednio z odblokowanego serwera CDN unpkg
            worker = await Tesseract.createWorker({
                workerPath: 'https://jsdelivr.net',
                corePath: 'https://jsdelivr.net',
                logger: m => {
                    if(m.status === 'initializing api') statusText.innerText = "Uruchamianie silnika...";
                    if(m.status === 'recognizing text') statusText.innerText = `Skanowanie (${Math.floor(m.progress * 100)}%)`;
                }
            });

            // Ładowanie podstawowego zestawu znaków
            await worker.loadLanguage('eng');
            await worker.initialize('eng');
            
            // Nakazujemy czytanie wyłącznie wielkich liter i cyfr (dla tablic i VIN)
            await worker.setParameters({
                tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
            });

            statusText.innerText = "Skaner gotowy! Umieść tekst w zielonej ramki.";
            
            // Cykliczne wywoływanie analizatora co 1,2 sekundy
            setInterval(scanFrame, 1200);
            
        } catch (err) {
            statusText.innerText = "Błąd krytyczny konfiguracji. Odśwież stronę.";
            console.error("Szczegóły błędu:", err);
        }
    }

    // Odpalenie tylnej kamery w telefonie
    async function startCamera() {
        try {
            statusText.innerText = "Łączenie z obiektywem...";
            const constraints = {
                video: {
                    facingMode: "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                initOCR(); // Start silnika tekstowego
            };
        } catch (cameraErr) {
            statusText.innerText = "Błąd: Brak uprawnień do kamery.";
            console.error(cameraErr);
        }
    }

    // Analiza wyciętego kadru z wideo
    async function scanFrame() {
        if (isProcessing || !worker) return;
        isProcessing = true;

        const sourceX = video.videoWidth * 0.05;
        const sourceY = video.videoHeight * 0.35;
        const sourceWidth = video.videoWidth * 0.9;
        const sourceHeight = video.videoHeight * 0.3;

        canvas.width = sourceWidth;
        canvas.height = sourceHeight;

        // Przerzucenie obrazu wideo na canvas
        ctx.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, sourceWidth, sourceHeight);

        // Agresywny filtr podbicia kontrastu czarno-białego klatki dla łatwiejszego odczytu
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            let brightness = 0.34 * data[i] + 0.5 * data[i + 1] + 0.16 * data[i + 2];
            let threshold = 128; 
            let color = brightness > threshold ? 255 : 0;
            data[i] = color;     
            data[i+1] = color;   
            data[i+2] = color;   
        }
        ctx.putImageData(imgData, 0, 0);

        try {
            const { data: { text } } = await worker.recognize(canvas);
            let cleanedText = text.replace(/[^A-Z0-9]/gi, '').toUpperCase().trim();

            if (cleanedText.length >= 4) {
                resultText.innerText = cleanedText;
                statusText.innerText = "Odczytano pomyślnie!";
            } else {
                statusText.innerText = "Szukam numeru... Trzymaj aparat stabilnie.";
            }
        } catch (ocrErr) {
            console.error("Błąd przetwarzania klatki:", ocrErr);
        } finally {
            isProcessing = false;
        }
    }

    window.addEventListener('DOMContentLoaded', startCamera);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Skaner Rejestracji (OCR.space)</title>
  <style>
    /* (stylizacja taka sama jak poprzednio) */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0c10;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { max-width: 720px; width: 100%; }
    .header {
      background: linear-gradient(135deg, #1a1f2e, #0d1117);
      border-radius: 20px;
      padding: 20px 24px;
      margin-bottom: 20px;
      border: 1px solid #2d3349;
    }
    h1 {
      font-size: 26px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
    }
    h1 .badge {
      background: #2563eb;
      font-size: 12px;
      padding: 2px 12px;
      border-radius: 30px;
      font-weight: 400;
    }
    .sub { color: #9ca3af; font-size: 14px; margin-top: 6px; }
    #modeLabel {
      display: inline-block;
      padding: 6px 20px;
      border-radius: 40px;
      background: #1a2a2a;
      color: #4ade80;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 12px;
      border: 1px solid #2d4a3a;
    }
    .camera-box {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      aspect-ratio: 16/9;
    }
    #video {
      width: 100%;
      display: block;
      background: #111;
      aspect-ratio: 16/9;
      object-fit: cover;
    }
    #scanFrame {
      position: absolute;
      left: 5%;
      width: 90%;
      top: 22%;
      height: 56%;
      border: 2.5px solid #4ade80;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(74,222,128,0.3);
      pointer-events: none;
    }
    .corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: #fff;
      border-style: solid;
    }
    .corner.tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
    .corner.tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; }
    .corner.bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; }
    .corner.br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }
    #scanLine {
      position: absolute;
      left: 6%;
      width: 88%;
      height: 2px;
      background: #4ade80;
      box-shadow: 0 0 15px #4ade80;
      top: 24%;
      animation: scan 2.5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes scan {
      0% { top: 24%; opacity: 0.6; }
      50% { top: 76%; opacity: 1; }
      100% { top: 24%; opacity: 0.6; }
    }
    #status {
      min-height: 28px;
      margin: 16px 0 12px;
      font-size: 15px;
      color: #fbbf24;
      text-align: center;
      font-weight: 500;
      background: rgba(0,0,0,0.3);
      padding: 8px 16px;
      border-radius: 10px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 8px 0 16px;
    }
    button {
      border: none;
      border-radius: 50px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: #fff;
      background: #374151;
      flex: 1 1 auto;
      min-width: 100px;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    button:active:not(:disabled) { transform: scale(0.95); }
    #startBtn { background: #16a34a; }
    #scanBtn { background: #2563eb; }
    #resetBtn { background: #6b7280; }
    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 12px 0;
    }
    .card {
      background: #181b20;
      border: 1px solid #2a2f36;
      border-radius: 14px;
      padding: 16px 18px;
    }
    .card .title {
      color: #9ca3af;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .card .value {
      font-size: 24px;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: 1px;
      word-break: break-all;
      min-height: 36px;
    }
    .card .value.placeholder { color: #6b7280; font-weight: 300; }
    #engineStatus {
      margin-top: 10px;
      color: #6b7280;
      font-size: 12px;
      text-align: center;
    }
    canvas { display: none; }
    @media (max-width: 550px) {
      .results { grid-template-columns: 1fr; }
      button { min-width: 80px; padding: 10px 14px; font-size: 13px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🚗 Skaner <span class="badge">OCR.space</span></h1>
    <div class="sub">Rozpoznawanie tablic rejestracyjnych</div>
  </div>
  <div id="modeLabel">NUMER REJESTRACYJNY</div>
  <div class="camera-box">
    <video id="video" autoplay muted playsinline></video>
    <div id="scanFrame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>
    <div id="scanLine"></div>
  </div>
  <div id="status">▶️ Naciśnij „Uruchom kamerę”</div>
  <div class="btn-group">
    <button id="startBtn">📷 Kamera</button>
    <button id="scanBtn" disabled>🔍 Skanuj</button>
    <button id="resetBtn">↺ Reset</button>
  </div>
  <div class="results">
    <div class="card">
      <div class="title">Numer rejestracyjny</div>
      <div class="value placeholder" id="regValue">—</div>
    </div>
  </div>
  <div id="engineStatus">⏳ Inicjalizacja...</div>
</div>

<canvas id="captureCanvas"></canvas>

<script>
// ============================================================
// ELEMENTY
// ============================================================
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const engineEl = document.getElementById('engineStatus');
const regValue = document.getElementById('regValue');
const startBtn = document.getElementById('startBtn');
const scanBtn = document.getElementById('scanBtn');
const resetBtn = document.getElementById('resetBtn');
const captureCanvas = document.getElementById('captureCanvas');

let cameraReady = false;
let processing = false;
let stream = null;

// ============================================================
// KAMERA
// ============================================================
async function startCamera() {
  if (cameraReady) return;
  try {
    statusEl.innerText = '⏳ Uruchamianie kamery...';
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment',
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        aspectRatio: 16/9
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    cameraReady = true;
    startBtn.style.display = 'none';
    statusEl.innerText = '📷 Kamera gotowa.';
    scanBtn.disabled = false;
    engineEl.innerText = '✅ Gotowy do skanowania';
  } catch (e) {
    console.error('Camera error', e);
    statusEl.innerText = '❌ Błąd kamery.';
    alert('Brak dostępu do kamery.');
  }
}

// ============================================================
// POBRANIE KLATKI
// ============================================================
function captureFrame() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;

  const sx = Math.floor(vw * 0.05);
  const sy = Math.floor(vh * 0.20);
  const sw = Math.floor(vw * 0.90);
  const sh = Math.floor(vh * 0.60);

  const canvas = document.createElement('canvas');
  canvas.width = sw;
  canvas.height = sh;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
  return canvas;
}

// ============================================================
// SKANOWANIE PRZEZ OCR.SPACE
// ============================================================
async function scanWithOCRspace(imageCanvas) {
  // Konwersja canvas do base64
  const dataUrl = imageCanvas.toDataURL('image/jpeg', 0.95);
  const base64Image = dataUrl.split(',')[1];

  // Twój darmowy klucz API z OCR.space (zarejestruj się na https://ocr.space/OCRAPI)
  const apiKey = 'K80970372488957'; // <-- ZASTĄP SWOIM KLIUCZEM (darmowy)
  const apiUrl = 'https://api.ocr.space/parse/image';

  const formData = new FormData();
  formData.append('apikey', apiKey);
  formData.append('base64Image', `data:image/jpeg;base64,${base64Image}`);
  formData.append('language', 'eng');
  formData.append('OCREngine', '2');  // 2 = najlepszy dla tablic
  formData.append('scale', 'true');
  formData.append('isTable', 'false');

  try {
    const response = await fetch(apiUrl, {
      method: 'POST',
      body: formData
    });
    const data = await response.json();
    console.log('OCR.space response:', data);

    if (data.IsErroredOnProcessing) {
      throw new Error(data.ErrorMessage || 'Błąd OCR');
    }

    const parsedResults = data.ParsedResults || [];
    if (parsedResults.length === 0) return null;

    let bestText = '';
    let bestConfidence = 0;
    for (const result of parsedResults) {
      const text = result.ParsedText || '';
      const confidence = parseFloat(result.TextOverlay?.Confidence || 0);
      if (text && confidence > bestConfidence) {
        bestConfidence = confidence;
        bestText = text;
      }
    }

    return { text: bestText, confidence: bestConfidence };
  } catch (e) {
    console.error('OCR.space error:', e);
    throw e;
  }
}

// ============================================================
// KOREKTA NUMERU
// ============================================================
function cleanText(t) {
  return t.toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function correctPlate(s) {
  if (!s || s.length < 4) return null;
  let v = cleanText(s);
  if (v.length < 4 || v.length > 8) return null;

  let candidates = [];
  for (let prefLen = 1; prefLen <= Math.min(3, v.length - 2); prefLen++) {
    let pref = v.substring(0, prefLen);
    let rest = v.substring(prefLen);
    pref = pref.replace(/0/g, 'O').replace(/1/g, 'I').replace(/2/g, 'Z').replace(/5/g, 'S');
    rest = rest.replace(/O/g, '0').replace(/I/g, '1').replace(/Z/g, '2').replace(/S/g, '5').replace(/B/g, '8');
    if (/^[A-Z]{1,3}$/.test(pref) && /^[0-9]{3,5}$/.test(rest)) {
      candidates.push(pref + rest);
    }
  }
  if (candidates.length === 0) return null;
  
  const score = (c) => {
    const p = c.match(/^[A-Z]+/)[0].length;
    const n = c.length - p;
    if (p === 2 && n === 5) return 100;
    if (p === 2 && n === 4) return 90;
    if (p === 3 && n === 4) return 80;
    if (p === 2 && n === 3) return 70;
    if (p === 1 && n === 5) return 60;
    return 50;
  };
  candidates.sort((a, b) => score(b) - score(a));
  return candidates[0];
}

function formatPlate(v) {
  if (!v) return null;
  const pref = v.match(/^[A-Z]+/)[0];
  const rest = v.substring(pref.length);
  return pref + ' ' + rest;
}

// ============================================================
// GŁÓWNE SKANOWANIE
// ============================================================
async function scan() {
  if (processing || !cameraReady) return;
  processing = true;
  scanBtn.disabled = true;
  statusEl.innerText = '📸 Pobieranie klatki...';

  try {
    const frame = captureFrame();
    if (!frame) {
      statusEl.innerText = '❌ Nie udało się pobrać klatki.';
      return;
    }

    statusEl.innerText = '📡 Wysyłanie do OCR.space...';
    const result = await scanWithOCRspace(frame);

    if (!result || !result.text) {
      statusEl.innerText = '❌ Nie rozpoznano tekstu. Spróbuj ponownie.';
      regValue.textContent = '—';
      regValue.className = 'value placeholder';
      return;
    }

    const cleaned = cleanText(result.text);
    const corrected = correctPlate(cleaned);
    if (corrected) {
      regValue.textContent = formatPlate(corrected);
      regValue.className = 'value';
      statusEl.innerText = `✅ Odczytano: ${formatPlate(corrected)} (pewność: ${Math.round(result.confidence)}%)`;
    } else {
      statusEl.innerText = `❌ Niepoprawny format: "${result.text}"`;
      regValue.textContent = result.text;
      regValue.className = 'value error';
    }
  } catch (e) {
    console.error('Scan error', e);
    statusEl.innerText = '❌ Błąd skanowania. Sprawdź klucz API.';
  } finally {
    processing = false;
    scanBtn.disabled = false;
  }
}

// ============================================================
// RESET
// ============================================================
function resetAll() {
  regValue.textContent = '—';
  regValue.className = 'value placeholder';
  statusEl.innerText = '🔄 Zresetowano. Ustaw tablicę w ramce.';
}

// ============================================================
// OBSŁUGA PRZYCISKÓW
// ============================================================
startBtn.addEventListener('click', startCamera);
scanBtn.addEventListener('click', scan);
resetBtn.addEventListener('click', resetAll);

// ============================================================
// START
// ============================================================
window.addEventListener('load', () => {
  engineEl.innerText = '⏳ Gotowy do pracy';
});

window.addEventListener('beforeunload', () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skaner Numerów Pojazdów</title>
    <!-- Oficjalny link do najnowszej wersji biblioteki rozpoznawania tekstu -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #121212;
            color: #ffffff;
            text-align: center;
        }
        #container {
            position: relative;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            display: block;
            transform: scaleX(1); /* Standardowy widok z tylnej kamery */
        }
        /* Zielona ramka celownika na środku ekranu */
        .scanner-laser {
            position: absolute;
            top: 40%;
            left: 10%;
            width: 80%;
            height: 20%;
            border: 3px solid #00ff00;
            box-shadow: 0 0 15px #00ff00;
            border-radius: 8px;
            pointer-events: none;
            box-sizing: border-box;
        }
        #result-box {
            margin-top: 20px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .status { color: #aaa; font-style: italic; font-size: 16px; }
        .number { font-size: 28px; font-weight: bold; color: #00ff00; margin-top: 10px; letter-spacing: 2px; }
        canvas { display: none; } /* Ukryte cyfrowe przetwarzanie obrazu */
    </style>
</head>
<body>

    <h1>Skaner Numerów na Pojazdach</h1>
    <p>Umieść numer rejestracyjny lub VIN wewnątrz zielonej ramki</p>

    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scanner-laser"></div>
    </div>

    <div id="result-box">
        <div id="status" class="status">Uruchamianie aparatu...</div>
        <div id="ocr-result" class="number">- - - - - -</div>
    </div>

    <canvas id="processing-canvas"></canvas>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('processing-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('ocr-result');
    
    let worker = null;
    let isScanning = false;

    // Poprawna inicjalizacja silnika OCR krok po kroku
    async function initOCR() {
        try {
            statusText.innerText = "Ładowanie silnika OCR...";
            
            // Tworzenie instancji w nowej strukturze v5
            worker = await Tesseract.createWorker();
            
            // Konfiguracja języków (polski i angielski)
            await worker.loadLanguage('pol+eng');
            await worker.initialize('pol+eng');
            
            // Ustawienie parametrów silnika, aby szukał tylko wielkich liter i cyfr (przydatne przy rejestracjach/VIN)
            await worker.setParameters({
                tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
            });

            statusText.innerText = "Skaner gotowy. Nakieruj na pojazd.";
            isScanning = true;
            startScanLoop();
        } catch (ocrError) {
            statusText.innerText = "Błąd inicjalizacji silnika tekstowego. Odśwież stronę.";
            console.error(ocrError);
        }
    }

    // Uruchomienie strumienia wideo z tylnej kamery w jakości HD
    async function startCamera() {
        try {
            const constraints = {
                video: {
                    facingMode: "environment", // Wymuszenie tylnego obiektywu w telefonie
                    width: { ideal: 1280 },    
                    height: { ideal: 720 },
                    focusMode: "continuous"    // Włączenie ciągłego autofocusu
                }
            };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                initOCR(); // Uruchomienie rozpoznawania dopiero po włączeniu kamery
            };
        } catch (err) {
            statusText.innerText = "Błąd kamery: Brak uprawnień lub urządzenie jest używane przez inną aplikację.";
            console.error(err);
        }
    }

    // Analiza klatek obrazu w locie
    async function startScanLoop() {
        if (!isScanning) return;

        // Wycinamy tylko obszar znajdujący się w zielonej ramce (oszczędność procesora)
        const sourceX = video.videoWidth * 0.1;
        const sourceY = video.videoHeight * 0.4;
        const sourceWidth = video.videoWidth * 0.8;
        const sourceHeight = video.videoHeight * 0.2;

        canvas.width = sourceWidth;
        canvas.height = sourceHeight;

        // Narysowanie wyciętego kadru na ukrytym płótnie canvas
        ctx.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, sourceWidth, sourceHeight);

        // Nakładanie filtra binarnego (zwiększenie kontrastu czerni i bieli)
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            let brightness = 0.34 * data[i] + 0.5 * data[i + 1] + 0.16 * data[i + 2];
            let threshold = 125; // Próg odcięcia światła
            let color = brightness > threshold ? 255 : 0;
            data[i] = color;     
            data[i+1] = color;   
            data[i+2] = color;   
        }
        ctx.putImageData(imgData, 0, 0);

        const dataUrl = canvas.toDataURL('image/png');

        try {
            // Przekazanie przetworzonego obrazu o wysokim kontraście bezpośrednio do biblioteki
            const { data: { text } } = await worker.recognize(dataUrl);
            
            // Oczyszczenie tekstu z ewentualnych spacji lub znaków specjalnych
            let cleanedText = text.replace(/[^A-Z0-9]/gi, '').toUpperCase().trim();

            // Akceptujemy odczyt, jeśli ma przynajmniej 4 znaki
            if (cleanedText.length >= 4) { 
                resultText.innerText = cleanedText;
                statusText.innerText = "Odczytano pomyślnie!";
            } else {
                statusText.innerText = "Szukam numerów... Dopasuj pozycję.";
            }
        } catch (e) {
            console.error("Błąd skanowania klatki: ", e);
        }

        // Kolejna klatka za 600ms, aby telefon działał płynnie i nie przegrzewał się
        setTimeout(startScanLoop, 600);
    }

    // Uruchomienie skanera po załadowaniu struktury strony
    window.addEventListener('DOMContentLoaded', startCamera);
</script>
</body>
</html>

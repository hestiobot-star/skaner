<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skaner Numerów Pojazdów</title>
    <!-- Ładowanie oficjalnej biblioteki Tesseract.js z zaufanego źródła CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #121212;
            color: #ffffff;
            text-align: center;
        }
        #container {
            position: relative;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            display: block;
        }
        /* Ramka celownika pomagająca użytkownikowi najechać na numer */
        .scanner-laser {
            position: absolute;
            top: 40%;
            left: 10%;
            width: 80%;
            height: 20%;
            border: 3px solid #00ff00;
            box-shadow: 0 0 15px #00ff00;
            border-radius: 8px;
            pointer-events: none;
            box-sizing: border-box;
        }
        #result-box {
            margin-top: 20px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .status { color: #aaa; font-style: italic; }
        .number { font-size: 24px; font-weight: bold; color: #00ff00; margin-top: 10px; letter-spacing: 2px; }
        canvas { display: none; } /* Ukryte przetwarzanie obrazu */
    </style>
</head>
<body>

    <h1>Skaner Numerów na Pojazdach</h1>
    <p>Umieść numer rejestracyjny lub VIN wewnątrz zielonej ramki</p>

    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scanner-laser"></div>
    </div>

    <div id="result-box">
        <div id="status" class="status">Uruchamianie aparatu...</div>
        <div id="ocr-result" class="number">- - - - - -</div>
    </div>

    <!-- Canvas do przetwarzania kontrastu klatek wideo -->
    <canvas id="processing-canvas"></canvas>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('processing-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('ocr-result');
    
    let worker = null;
    let isScanning = false;

    // 1. Inicjalizacja Silnika OCR Tesseract
    async function initOCR() {
        statusText.innerText = "Ładowanie silnika rozpoznawania tekstu...";
        worker = await Tesseract.createWorker('pol+eng'); // Obsługa polskich i angielskich czcionek
        statusText.innerText = "Skaner gotowy. Nakieruj na pojazd.";
        isScanning = true;
        startScanLoop();
    }

    // 2. Uruchomienie Kamery z optymalnymi parametrami dla pojazdów
    async function startCamera() {
        try {
            const constraints = {
                video: {
                    facingMode: "environment", // Wymuszenie tylnej kamery w telefonie
                    width: { ideal: 1920 },    // Wysoka jakość dla ostrego tekstu
                    height: { ideal: 1080 },
                    focusMode: "continuous"    // Próba wymuszenia ciągłego autofocusu
                }
            };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            
            // Po uruchomieniu wideo, inicjalizuj tekst
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                initOCR();
            };
        } catch (err) {
            statusText.innerText = "Błąd kamery: Brak uprawnień lub brak kamery w urządzeniu.";
            console.error(err);
        }
    }

    // 3. Pętla przetwarzania obrazu i skanowania na żywo
    async function startScanLoop() {
        if (!isScanning) return;

        // Kopiujemy tylko obszar z zielonej ramki (środek ekranu), aby przyspieszyć działanie
        const sourceX = video.videoWidth * 0.1;
        const sourceY = video.videoHeight * 0.4;
        const sourceWidth = video.videoWidth * 0.8;
        const sourceHeight = video.videoHeight * 0.2;

        canvas.width = sourceWidth;
        canvas.height = sourceHeight;

        // Rysowanie kadru na ukrytym canvasie
        ctx.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, sourceWidth, sourceHeight);

        // FILTR KONTRASTU: Przekształcenie obrazu na czarno-biały (Binaryzacja progowa)
        // Ekstremalnie poprawia czytelność brudnych lub odblaskowych tablic rejestracyjnych
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            let brightness = 0.34 * data[i] + 0.5 * data[i + 1] + 0.16 * data[i + 2];
            // Próg odcięcia: jeśli punkt jest ciemny -> zrób idealnie czarny, jeśli jasny -> idealnie biały
            let threshold = 120; 
            let color = brightness > threshold ? 255 : 0;
            data[i] = color;     // R
            data[i+1] = color;   // G
            data[i+2] = color;   // B
        }
        ctx.putImageData(imgData, 0, 0);

        // Pobranie przetworzonego obrazu jako bazy do odczytu tekstowego
        const dataUrl = canvas.toDataURL('image/png');

        try {
            statusText.innerText = "Analizowanie obrazu...";
            const { data: { text } } = await worker.recognize(dataUrl);
            
            // Oczyszczanie wyniku ze znaków specjalnych, spacji i śmieci tekstowych
            let cleanedText = text.replace(/[^A-Z0-9]/gi, '').toUpperCase();

            if (cleanedText.length >= 4) { // Wyświetlaj tylko jeśli odczytano realną sekwencję znaków
                resultText.innerText = cleanedText;
                statusText.innerText = "Odczytano pomyślnie!";
            } else {
                statusText.innerText = "Szukam numerów... Dopasuj pozycję.";
            }
        } catch (e) {
            console.error(e);
        }

        // Odczekaj 500ms przed kolejną próbą, aby nie zawiesić telefonu/przeglądarki
        setTimeout(startScanLoop, 500);
    }

    // Uruchomienie skanera po załadowaniu strony
    window.addEventListener('DOMContentLoaded', startCamera);
</script>
</body>
</html>

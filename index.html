<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skaner Tablic i VIN</title>
    <!-- Użycie stabilnej wersji Tesseract ze sprawdzonymi ścieżkami bazowymi -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #121212;
            color: #ffffff;
            text-align: center;
        }
        #container {
            position: relative;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            display: block;
        }
        .scanner-laser {
            position: absolute;
            top: 35%;
            left: 5%;
            width: 90%;
            height: 30%;
            border: 3px solid #00ff00;
            box-shadow: 0 0 15px #00ff00;
            border-radius: 8px;
            pointer-events: none;
            box-sizing: border-box;
        }
        #result-box {
            margin-top: 20px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .status { color: #ffcc00; font-style: italic; font-size: 16px; }
        .number { font-size: 32px; font-weight: bold; color: #00ff00; margin-top: 10px; letter-spacing: 2px; }
        canvas { display: none; } 
    </style>
</head>
<body>

    <h1>Skaner Numerów na Pojazdach</h1>
    <p>Umieść numer rejestracyjny lub VIN wewnątrz zielonej ramki</p>

    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="scanner-laser"></div>
    </div>

    <div id="result-box">
        <div id="status" class="status">Inicjalizacja kamery...</div>
        <div id="ocr-result" class="number">- - - - - -</div>
    </div>

    <canvas id="processing-canvas"></canvas>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('processing-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('ocr-result');
    
    let isProcessing = false;

    // Funkcja uruchamiająca kamerę
    async function startCamera() {
        try {
            statusText.innerText = "Uruchamianie podglądu wideo...";
            const constraints = {
                video: {
                    facingMode: "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                statusText.innerText = "Skaner aktywny. Dopasuj odległość od tablicy.";
                // Start pętli przechwytywania klatek
                setInterval(captureFrame, 1000); // Analiza co 1 sekundę, by nie przeciążać procesora
            };
        } catch (err) {
            statusText.innerText = "Błąd: Brak uprawnień do kamery.";
            console.error(err);
        }
    }

    // Wycinanie i przygotowanie obrazu z ramki celownika
    async function captureFrame() {
        if (isProcessing) return; // Jeśli poprzednia klatka jeszcze się analizuje, pomiń
        isProcessing = true;

        const sourceX = video.videoWidth * 0.05;
        const sourceY = video.videoHeight * 0.35;
        const sourceWidth = video.videoWidth * 0.9;
        const sourceHeight = video.videoHeight * 0.3;

        canvas.width = sourceWidth;
        canvas.height = sourceHeight;

        ctx.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, sourceWidth, sourceHeight);

        // Proste i bezbłędne wywołanie Tesseract bez tworzenia skomplikowanych workerów systemowych
        try {
            statusText.innerText = "Przetwarzanie tekstu...";
            
            // Wykorzystujemy uproszczoną metodę bezpośrednią Tesseract.recognize
            const result = await Tesseract.recognize(
                canvas,
                'eng',
                { 
                    logger: m => console.log(m),
                    // Przekazujemy regułę filtrowania bezpośrednio do rdzenia bez modyfikacji plików systemowych
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
                }
            );

            let txt = result.data.text;
            let cleanedText = txt.replace(/[^A-Z0-9]/gi, '').toUpperCase().trim();

            if (cleanedText.length >= 4) {
                resultText.innerText = cleanedText;
                statusText.innerText = "Odczytano pomyślnie!";
            } else {
                statusText.innerText = "Skoncentruj aparat na numerach...";
            }
        } catch (ocrErr) {
            console.error("Błąd rozpoznawania klatki:", ocrErr);
            statusText.innerText = "Próba ponowna odczytu...";
        } finally {
            isProcessing = false;
        }
    }

    window.addEventListener('DOMContentLoaded', startCamera);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skaner rejestracji – OCR.space</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0d10;
            color: #e0e0e0;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 720px; width: 100%; }
        h1 {
            font-size: 28px;
            font-weight: 300;
            margin: 8px 0 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        h1 span { background: #1f2937; padding: 0 14px; border-radius: 30px; font-size: 16px; font-weight: 400; }
        .sub { color: #9ca3af; font-size: 14px; margin-bottom: 18px; text-align: center; }
        #modeLabel {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            background: #1a2a2a;
            color: #4ade80;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 12px;
            border: 1px solid #2d4a3a;
        }
        .camera-box {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            aspect-ratio: 16/9;
        }
        #video {
            width: 100%;
            display: block;
            background: #111;
            aspect-ratio: 16/9;
            object-fit: cover;
        }
        #scanFrame {
            position: absolute;
            left: 6%;
            width: 88%;
            top: 22%;
            height: 56%;
            border: 2.5px solid #4ade80;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(74,222,128,0.4), inset 0 0 20px rgba(74,222,128,0.1);
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .corner {
            position: absolute;
            width: 22px;
            height: 22px;
            border-color: #fff;
            border-style: solid;
        }
        .corner.tl { top: -3px; left: -3px; border-width: 4px 0 0 4px; }
        .corner.tr { top: -3px; right: -3px; border-width: 4px 4px 0 0; }
        .corner.bl { bottom: -3px; left: -3px; border-width: 0 0 4px 4px; }
        .corner.br { bottom: -3px; right: -3px; border-width: 0 4px 4px 0; }
        #scanLine {
            position: absolute;
            left: 7%;
            width: 86%;
            height: 2px;
            background: #4ade80;
            box-shadow: 0 0 12px #4ade80;
            top: 24%;
            animation: scan 2.2s ease-in-out infinite;
            pointer-events: none;
            border-radius: 2px;
        }
        @keyframes scan {
            0% { top: 24%; }
            50% { top: 76%; }
            100% { top: 24%; }
        }
        #status {
            min-height: 28px;
            margin: 16px 0 12px;
            font-size: 15px;
            color: #fcd34d;
            text-align: center;
            font-weight: 500;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 8px 0 16px;
        }
        button {
            border: none;
            border-radius: 50px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
            background: #374151;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            flex: 1 1 auto;
            min-width: 110px;
        }
        button:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }
        button:active:not(:disabled) { transform: scale(0.96); }
        #startBtn { background: #16a34a; }
        #scanBtn { background: #2563eb; }
        #nextBtn { background: #d97706; display: none; }
        #resetBtn { background: #6b7280; }
        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 12px 0;
        }
        .card {
            background: #181b20;
            border: 1px solid #2a2f36;
            border-radius: 16px;
            padding: 16px 18px;
            text-align: left;
            transition: border-color 0.3s;
        }
        .card .title {
            color: #9ca3af;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .card .value {
            font-size: 26px;
            font-weight: 700;
            color: #4ade80;
            letter-spacing: 1.5px;
            word-break: break-all;
            min-height: 40px;
        }
        .card .value.placeholder { color: #6b7280; font-weight: 300; }
        #engineStatus {
            margin-top: 10px;
            color: #6b7280;
            font-size: 12px;
            text-align: center;
        }
        canvas { display: none; }
        @media (max-width: 550px) {
            .results { grid-template-columns: 1fr; }
            button { min-width: 80px; padding: 12px 16px; font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🚗 Skaner <span>rejestracji</span></h1>
    <div class="sub">Zeskanuj numer rejestracyjny, następnie VIN</div>
    <div id="modeLabel">ETAP 1 — NUMER REJESTRACYJNY</div>
    <div class="camera-box">
        <video id="video" autoplay muted playsinline></video>
        <div id="scanFrame">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
        </div>
        <div id="scanLine"></div>
    </div>
    <div id="status">Naciśnij „Uruchom kamerę”</div>
    <div class="btn-group">
        <button id="startBtn">📷 Kamera</button>
        <button id="scanBtn" disabled>🔍 Skanuj</button>
        <button id="nextBtn">➡️ VIN</button>
        <button id="resetBtn">↺ Reset</button>
    </div>
    <div class="results">
        <div class="card">
            <div class="title">Numer rejestracyjny</div>
            <div class="value placeholder" id="regValue">—</div>
        </div>
        <div class="card">
            <div class="title">VIN</div>
            <div class="value placeholder" id="vinValue">—</div>
        </div>
    </div>
    <div id="engineStatus">Inicjalizacja...</div>
</div>

<canvas id="captureCanvas"></canvas>

<script>
// ============================================================
// ELEMENTY
// ============================================================
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const engineEl = document.getElementById('engineStatus');
const modeLabel = document.getElementById('modeLabel');
const regValue = document.getElementById('regValue');
const vinValue = document.getElementById('vinValue');
const startBtn = document.getElementById('startBtn');
const scanBtn = document.getElementById('scanBtn');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
const scanFrame = document.getElementById('scanFrame');
const captureCanvas = document.getElementById('captureCanvas');
const capCtx = captureCanvas.getContext('2d');

let cameraReady = false;
let processing = false;
let mode = 'REGISTRATION';
let stream = null;
let lastPlate = null;

// ============================================================
// KAMERA
// ============================================================
async function startCamera() {
    if (cameraReady) return;
    try {
        statusEl.innerText = 'Uruchamianie kamery...';
        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: 'environment',
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                aspectRatio: 16/9
            },
            audio: false
        });
        video.srcObject = stream;
        await video.play();
        cameraReady = true;
        startBtn.style.display = 'none';
        statusEl.innerText = 'Kamera gotowa.';
        scanBtn.disabled = false;
        engineEl.innerText = '✅ Kamera + OCR.space gotowe';
    } catch (e) {
        console.error('Camera error', e);
        statusEl.innerText = 'Błąd kamery. Sprawdź uprawnienia.';
        alert('Brak dostępu do kamery.');
    }
}

// ============================================================
// POBRANIE KLATKI
// ============================================================
function captureFrameFromVideo() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;

    const sx = Math.floor(vw * 0.05);
    const sy = Math.floor(vh * 0.20);
    const sw = Math.floor(vw * 0.90);
    const sh = Math.floor(vh * 0.60);

    captureCanvas.width = sw;
    captureCanvas.height = sh;
    capCtx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
    return captureCanvas;
}

// ============================================================
// OCR.space API (DARMOWY KLUCZ)
// ============================================================
async function recognizeWithOCRspace(imageDataUrl) {
    const apiKey = 'K81489931088957'; // DARMOWY KLUCZ TESTOWY
    const url = 'https://api.ocr.space/parse/image';

    const formData = new FormData();
    formData.append('base64Image', imageDataUrl.split(',')[1]);
    formData.append('apikey', apiKey);
    formData.append('language', 'eng');
    formData.append('OCREngine', '2'); // Engine 2 – lepszy dla tablic
    formData.append('scale', 'true');
    formData.append('detectOrientation', 'true');

    try {
        const response = await fetch(url, {
            method: 'POST',
            body: formData
        });
        const data = await response.json();
        console.log('OCR.space response:', data);

        if (data.IsErroredOnProcessing) {
            throw new Error(data.ErrorMessage || 'Błąd OCR');
        }

        const parsedText = data.ParsedResults?.[0]?.ParsedText || '';
        return { text: parsedText, confidence: data.ParsedResults?.[0]?.TextOverlay?.Lines?.[0]?.Words?.[0]?.Confidence || 0 };
    } catch (e) {
        console.error('OCR.space error:', e);
        return { text: '', confidence: 0 };
    }
}

// ============================================================
// CZYSZCZENIE I KOREKTA
// ============================================================
function cleanText(t) {
    return t.toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function correctPlate(s) {
    if (!s || s.length < 4) return null;
    let v = s.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (v.length < 4 || v.length > 8) return null;

    let candidates = [];
    for (let prefLen = 1; prefLen <= Math.min(3, v.length-3); prefLen++) {
        let pref = v.substring(0, prefLen);
        let rest = v.substring(prefLen);
        pref = pref.replace(/0/g, 'O').replace(/1/g, 'I').replace(/2/g, 'Z').replace(/5/g, 'S');
        rest = rest.replace(/O/g, '0').replace(/I/g, '1').replace(/Z/g, '2').replace(/S/g, '5').replace(/B/g, '8');
        if (/^[A-Z]{1,3}$/.test(pref) && /^[0-9]{3,5}$/.test(rest)) {
            candidates.push(pref + rest);
        }
    }
    if (candidates.length === 0) return null;
    const score = (c) => {
        const p = c.match(/^[A-Z]+/)[0].length;
        const n = c.length - p;
        if (p === 2 && n === 5) return 100;
        if (p === 2 && n === 4) return 90;
        if (p === 3 && n === 4) return 80;
        if (p === 2 && n === 3) return 70;
        if (p === 1 && n === 5) return 60;
        return 50;
    };
    candidates.sort((a, b) => score(b) - score(a));
    return candidates[0];
}

function formatPlate(v) {
    if (!v) return null;
    const pref = v.match(/^[A-Z]+/)[0];
    const rest = v.substring(pref.length);
    return pref + ' ' + rest;
}

function correctVIN(s) {
    let v = s.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (v.length === 18) {
        for (let i=0; i<v.length; i++) {
            const cand = v.substring(0,i) + v.substring(i+1);
            if (/^[A-HJ-NPR-Z0-9]{17}$/.test(cand)) { v = cand; break; }
        }
    }
    v = v.replace(/O/g,'0').replace(/I/g,'1').replace(/Q/g,'0');
    if (/^[A-HJ-NPR-Z0-9]{17}$/.test(v)) return v;
    return null;
}

// ============================================================
// SKANOWANIE
// ============================================================
async function scan() {
    if (processing || !cameraReady) return;
    processing = true;
    scanBtn.disabled = true;
    statusEl.innerText = '📸 Pobieranie klatki...';

    try {
        const canvas = captureFrameFromVideo();
        if (!canvas) { statusEl.innerText = 'Błąd pobierania klatki.'; return; }

        // Konwersja do base64
        const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
        statusEl.innerText = '📤 Wysyłanie do OCR.space...';
        
        const result = await recognizeWithOCRspace(dataUrl);
        const cleaned = cleanText(result.text);
        
        console.log('Surowe wyniki OCR:', result.text);
        console.log('Po czyszczeniu:', cleaned);

        if (mode === 'REGISTRATION') {
            const plate = correctPlate(cleaned);
            if (plate) {
                lastPlate = plate;
                regValue.textContent = formatPlate(plate);
                regValue.className = 'value';
                statusEl.textContent = '✅ Odczytano: ' + formatPlate(plate);
                nextBtn.style.display = 'inline-block';
                scanBtn.style.display = 'none';
            } else {
                statusEl.textContent = '❌ Nie rozpoznano tablicy. Spróbuj ponownie.';
                regValue.textContent = '—';
                regValue.className = 'value placeholder';
            }
        } else {
            const vin = correctVIN(cleaned);
            if (vin) {
                vinValue.textContent = vin;
                vinValue.className = 'value';
                statusEl.textContent = '✅ VIN odczytany: ' + vin;
                scanBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            } else {
                statusEl.textContent = '❌ Nie rozpoznano VIN. Spróbuj ponownie.';
                vinValue.textContent = '—';
                vinValue.className = 'value placeholder';
            }
        }
    } catch (e) {
        console.error('Scan error:', e);
        statusEl.textContent = '❌ Błąd skanowania. Sprawdź połączenie z internetem.';
    } finally {
        processing = false;
        if (mode === 'REGISTRATION') scanBtn.disabled = false;
        else scanBtn.disabled = false;
    }
}

// ============================================================
// PRZEŁĄCZANIE
// ============================================================
function switchToVIN() {
    mode = 'VIN';
    modeLabel.textContent = 'ETAP 2 — NUMER VIN';
    modeLabel.style.background = '#1e293b';
    modeLabel.style.color = '#60a5fa';
    scanFrame.style.top = '16%';
    scanFrame.style.height = '68%';
    statusEl.textContent = 'Ustaw VIN w ramce.';
    nextBtn.style.display = 'none';
    scanBtn.style.display = 'inline-block';
    scanBtn.disabled = false;
}

function resetAll() {
    mode = 'REGISTRATION';
    modeLabel.textContent = 'ETAP 1 — NUMER REJESTRACYJNY';
    modeLabel.style.background = '#1a2a2a';
    modeLabel.style.color = '#4ade80';
    scanFrame.style.top = '22%';
    scanFrame.style.height = '56%';
    regValue.textContent = '—';
    regValue.className = 'value placeholder';
    vinValue.textContent = '—';
    vinValue.className = 'value placeholder';
    nextBtn.style.display = 'none';
    scanBtn.style.display = 'inline-block';
    if (cameraReady) scanBtn.disabled = false;
    else scanBtn.disabled = true;
    statusEl.textContent = 'Gotowy. Ustaw tablicę w ramce.';
    lastPlate = null;
}

// ============================================================
// PRZYCISKI
// ============================================================
startBtn.addEventListener('click', startCamera);
scanBtn.addEventListener('click', scan);
nextBtn.addEventListener('click', switchToVIN);
resetBtn.addEventListener('click', resetAll);

// ============================================================
// START
// ============================================================
window.addEventListener('load', () => {
    engineEl.innerText = '✅ Gotowy. Używa OCR.space (darmowe API)';
    statusEl.innerText = 'Naciśnij „Uruchom kamerę”';
});

window.addEventListener('beforeunload', () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
});
</script>
</body>
</html>
